name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v4
    permissions:
      contents: write
    with:
      # 首次审核前：仅上传 GitHub Release 资产，不同步到应用市场。
      skip-appstore-release: true
      # ------------------------------------------------------------------
      # 首次审核通过后，启用自动同步到应用市场：
      # 1) 以上 with 移除 skip-appstore-release（或置 false）；
      # 2) 添加 app-id: <应用市场应用ID>，见 https://www.halo.run/uc/developer/apps
      # 3) 加 secrets 映射并配置 HALO_PAT（Halo 官网个人令牌，勾选“应用市场开发者 > 版本管理”）：
      #    secrets:
      #      halo-pat: ${{ secrets.HALO_PAT }}
      # ------------------------------------------------------------------