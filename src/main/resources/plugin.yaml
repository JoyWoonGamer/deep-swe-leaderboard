# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest
apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: plugin-deepswe-leaderboard
spec:
  enabled: true
  requires: ">=2.20.0"
  author:
    name: JoyWoon
    website: https://github.com/JoyWoon
  logo: logo.png
  homepage: https://github.com/JoyWoon/deep-swe-leaderboard
  repo: https://github.com/JoyWoon/deep-swe-leaderboard
  issues: https://github.com/JoyWoon/deep-swe-leaderboard/issues
  displayName: "DeepSWE 排行榜"
  description: "在 Halo 站点展示 DeepSWE 编程智能体基准测试的实时排行榜（模型 Pass@1 / 成本 / 步数 / 输出 token）"
  version: "1.0.0"
  settingName: deep-swe-leaderboard-settings
  configMapName: deep-swe-leaderboard-config
  license:
    - name: "GPL-3.0"
      url: "https://github.com/JoyWoon/deep-swe-leaderboard/blob/main/LICENSE"
