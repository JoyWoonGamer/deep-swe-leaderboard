<head th:fragment="head">
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="76x76" th:href="${theme.config.global.apple_touch_icon}">
    <link rel="icon" th:href="${theme.config.global.favicon}">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta th:if="${theme.config.global.force_https}" http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2" />
    <meta name="theme-color" th:content="${theme.config.color.navbar_bg_color}">
    <title th:text="${site_title}"></title>
    <th:block th:if="${not #strings.isEmpty(theme.config.custom.head_html)}" th:utext="${theme.config.custom.head_html}"> </th:block>
    <!-- 主题依赖的图标库，不要自行修改 -->
    <link rel="stylesheet" th:href="@{/assets/libs/twitter-bootstrap/bootstrap.min.css?v='4.6.1'}">
    <th:block th:if="${_head != null}">
        <th:block th:replace="${_head}" />
    </th:block>
    <link rel="stylesheet" href="//at.alicdn.com/t/c/font_1749284_5i9bdhy70f8.css">
    <link rel="stylesheet" href="//at.alicdn.com/t/c/font_1736178_k526ubmyhba.css">
    <th:block th:replace="~{'modules/variables/variables-root'}"/>
    <link rel="stylesheet" href="/themes/theme-fluid/assets/css/main.css?v=1.1.3">
    <th:block th:replace="~{'modules/variables/configs'}"/>
    <th:block th:replace="~{'modules/variables/ground-glass'}"/>
    <script th:src="@{/assets/js/utils.js?v={version}(version=${theme.spec.version})}"></script>
    <script th:src="@{/assets/js/color-schema.js?v={version}(version=${theme.spec.version})}"></script>
    <style th:if="${theme.config.global.hidden_scroll_bar}">
        html::-webkit-scrollbar {
          width: 0;
          height: 0;
        }
        html {
          scrollbar-width: none;
        }
        html {
          overflow: -moz-scrollbars-none;
        }
    </style>

    <style type="text/css"
        th:if="${not #strings.isEmpty(theme.config.custom.code_css)}"
        th:utext="${theme.config.custom.code_css}" ></style>
  <script>
  window.addEventListener('DOMContentLoaded', function(){
    // yxh_h1_fix: 首页/归档页等无 H1，将 hero 口号 div.h2 提升为 h1（仅当页面尚无 h1，避免文章页重复 H1）
    (function(){
      var heroTitle = document.querySelector('.banner-text .h2');
      if (heroTitle && document.querySelectorAll('h1').length === 0) {
        var h1 = document.createElement('h1');
        h1.className = heroTitle.className;
        h1.style.margin = '0';
        // yxh_h1_fix: 用移动子节点代替 innerHTML 复制，保留原 #subtitle 节点引用，
        // 避免 Typed 打字机实例(绑定原节点)写向已脱离 DOM 的旧节点导致 banner 轻语文字空白
        while (heroTitle.firstChild) {
          h1.appendChild(heroTitle.firstChild);
        }
        heroTitle.parentNode.replaceChild(h1, heroTitle);
      }
    })();
    var path=location.pathname;
    var m=path.match(/\/page\/(\d+)\/?$/);
    if(m && parseInt(m[1],10)>1){
      var n=m[1], selfUrl=location.origin+path;
      var c=document.querySelector('link[rel="canonical"]');
      if(c){c.setAttribute('href',selfUrl);}else{var nc=document.createElement('link');nc.rel='canonical';nc.href=selfUrl;document.head.appendChild(nc);}
      var o=document.querySelector('meta[property="og:url"]'); if(o){o.setAttribute('content',selfUrl);}
      if(document.title.indexOf('第'+n+'页')===-1){document.title=document.title+' - 第'+n+'页';}
    }
    var c2=document.querySelector('link[rel="canonical"]');
    if(c2){c2.setAttribute('href',c2.getAttribute('href').replace(/^http:\/\//i, location.protocol + '://'));}
    var o2=document.querySelector('meta[property="og:url"]');
    if(o2){o2.setAttribute('content',o2.getAttribute('content').replace(/^http:\/\//i, location.protocol + '://'));}
  });
  </script>
  <script>
  window.addEventListener('DOMContentLoaded', function(){
    var body = document.querySelector('.markdown-body');
    if(!body) return;
    var h1 = document.querySelector('h1');
    var ctx = ((h1 ? h1.textContent : '') || document.title || '').trim();
    body.querySelectorAll('img').forEach(function(img){
      if(!img.hasAttribute('loading')){ img.setAttribute('loading', 'lazy'); }
      var a = img.getAttribute('alt');
      if(a === null || a.trim() === ''){
        var fn = img.getAttribute('src') || '';
        try {
          fn = decodeURIComponent(fn.split('/').pop().split('?')[0].replace(/\.\w+$/, ''));
        } catch(e) { fn = ''; }
        img.setAttribute('alt', (fn && fn.length > 1) ? fn : ctx);
      }
    });
  });
  </script>
  <!-- yxh-baidu-auto-push (2026-09-10) -->
  <script>
  (function(){
    try{
      var bp = document.createElement("script");
      var p = (window.location.protocol || "").split(":")[0];
      bp.src = (p === "https") ? "https://zz.bdstatic.com/linksubmit/push.js"
                               : "http://push.zhanzhang.baidu.com/push.js";
      bp.async = true;
      (document.head || document.getElementsByTagName("head")[0]).appendChild(bp);
    } catch(e) {}
  })();
  </script>
</head>
